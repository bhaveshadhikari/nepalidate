[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samaya"
version = "0.1.1"
description = "A lightweight Python library for Nepali BS/AD date conversion and calendar utilities"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Bhavesh Adhikari"}
]
keywords = ["nepali", "date", "converter", "bikram", "sambat"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytz>=2021.1",
]

[project.urls]
Homepage = "https://github.com/bhaveshadhikari/samaya"
