<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Nepal Clock</title>
    <style>
        body {
            margin: 0;
            background: transparent;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .time {
            font-size: 26px;
            font-weight: bold;
        }
        .date {
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="time" id="clock">{{ time }}</div>
    <div class="date">
        {{ weekday }}<br>
        AD: {{ ad_date }}<br>
        BS: {{ bs_date }}
    </div>

    <script>
        let [h, m, s] = "{{ time }}".split(":").map(Number);

        setInterval(() => {
            s++;
            if (s === 60) { s = 0; m++; }
            if (m === 60) { m = 0; h++; }
            if (h === 24) { h = 0; }

            document.getElementById("clock").innerText =
                String(h).padStart(2, '0') + ":" +
                String(m).padStart(2, '0') + ":" +
                String(s).padStart(2, '0');
        }, 1000);

        // Reload at midnight for date update
        const now = new Date();
        const midnight = new Date();
        midnight.setHours(24, 0, 0, 0);
        setTimeout(() => location.reload(), midnight - now);
    </script>
</body>
</html>
